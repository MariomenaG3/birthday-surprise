<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صور وفيديو لنا يا حبيبتي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحة الفيديو والصور -->
  <div class="page" id="page3">
    <div class="content surprise-card">
      <h2>فيديو وصور لنا على أغنيتك ❤️</h2>

      <!-- هنا put الفيديو بتاعتك (استبدلي بملف الفيديو الحقيقي لاحقًا) -->
      <video class="surprise-video" controls playsinline poster="placeholder-video.jpg">
        <source src="our-video.mp4" type="video/mp4">
        المتصفح بتاعك لا يدعم تشغيل الفيديو.
      </video>

      <p class="video-hint">
        ℹ️ استبدلي <b>our-video.mp4</b> بملف الفيديو بتاعك، وقومي بإضافةSong في السطر الخاص بالصوت.
      </p>

      <!-- خلفية صوتية اختيارية (استبدلي بأغنيتك reales) -->
      <audio id="bg-music" loop>
        <source src="our-song.mp3" type="audio/mpeg">
      </audio>

      <div style="margin-top: 1.5rem;">
        <button class="next-btn" onclick="playMusic()">تشغيل الأغنية 🎵</button>
        <a href="index.html" class="back-btn">البداية من جديد 🔁</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
